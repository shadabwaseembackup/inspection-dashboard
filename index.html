<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Katwaria Sarai load and loss board</title>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8eeec;--paper:#f6f9f8;--ink:#0e2a33;--mute:#587078;--rule:#c5d3d0;--lo:#0f8b8d;--mid:#f2a900;--hi:#c1121f;--sel:#0e2a33}
@media (prefers-color-scheme:dark){:root{--bg:#0c1d24;--paper:#12282f;--ink:#e3efec;--mute:#8fa9ae;--rule:#25414a;--lo:#35b6b4;--mid:#f4b942;--hi:#ff6b6b;--sel:#e3efec}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Schibsted Grotesk",system-ui,sans-serif}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--mid);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:end;padding:20px 32px 0}
.top h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em;margin-right:auto}
.top h1 small{display:block;font-size:13px;font-weight:400;color:var(--mute);letter-spacing:0}
.ctl{display:flex;gap:14px;flex-wrap:wrap;align-items:end}
.ctl label{font-size:12px;color:var(--mute);display:flex;flex-direction:column}
select,input[type=search]{background:var(--paper);border:0;border-bottom:2px solid var(--rule);padding:5px 6px;min-width:130px}
#reload{background:var(--ink);color:var(--paper);border:0;padding:8px 14px;border-radius:2px;cursor:pointer}
nav{display:flex;gap:26px;padding:14px 32px 0;border-bottom:1px solid var(--rule)}
nav button{background:none;border:0;padding:8px 0;cursor:pointer;color:var(--mute);border-bottom:3px solid transparent;font-weight:500}
nav button[aria-selected=true]{color:var(--ink);border-color:var(--ink);font-weight:700}
main{padding:28px 32px 48px;max-width:1400px}
#msg{padding:60px 32px;color:var(--mute)} #msg.err{color:var(--hi)}
.lead{font-size:clamp(24px,3.4vw,40px);line-height:1.15;font-weight:800;letter-spacing:-.02em;max-width:900px;margin:0 0 26px}
.lead em{font-style:normal;color:var(--hi)}
.spec{display:flex;height:46px;gap:2px;margin-bottom:8px}
.spec i{display:block;min-width:3px}
.speclab{display:flex;gap:2px;font-size:12px;color:var(--mute);margin-bottom:34px}
.speclab span{overflow:hidden;white-space:nowrap}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:40px}
h2{font-size:17px;margin:0 0 4px;font-weight:700}
.sub{color:var(--mute);font-size:13px;margin:0 0 14px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px 22px;margin:0 0 34px;padding:16px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.facts b{display:block;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}.facts span{font-size:13px;color:var(--mute)}
.hrs{display:flex;align-items:end;gap:6px;height:150px;margin-bottom:6px}
.hrs div{flex:1;display:flex;flex-direction:column;justify-content:end;height:100%;text-align:center;font-size:11px;color:var(--mute)}
.hrs i{display:block;width:100%;min-height:2px}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:grid;grid-template-columns:minmax(0,1.6fr) 90px minmax(80px,1fr);gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule);font-size:14px}
.rows .n{text-align:right;font-variant-numeric:tabular-nums}
.rows small{display:block;color:var(--mute);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trk{position:relative;height:10px;background:var(--rule)}
.trk i{position:absolute;left:0;top:0;bottom:0}
.trk u{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--ink);opacity:.55}
.split{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:36px}
@media (max-width:820px){.split{grid-template-columns:1fr}main,.top,nav{padding-left:18px;padding-right:18px}}
.fl{max-height:70vh;overflow:auto;border-right:1px solid var(--rule);padding-right:10px}
.fl h3{font-size:12px;color:var(--mute);margin:14px 0 4px;font-weight:500}
.fl button{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:6px 8px;cursor:pointer}
.fl button[aria-pressed=true]{border-color:var(--sel);background:var(--paper)}
.fl button span{display:block;font-size:12px;color:var(--mute)}
.fl .trk{height:4px;margin-top:4px}
.dtrow{grid-template-columns:minmax(0,1.5fr) 80px minmax(120px,1.2fr)!important}
#foot{padding:0 32px 32px;color:var(--mute);font-size:12px;max-width:1000px}
.lossrow{display:grid;grid-template-columns:minmax(0,1fr) 70px 70px;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--rule);font-size:14px}
.lossrow .trk{grid-column:1/-1;height:7px;margin-top:-2px}
</style>
</head>
<body>
<div class="top">
  <h1>Katwaria Sarai load and loss board<small id="sub">Loading from Google Sheets…</small></h1>
  <div class="ctl">
    <label>Division<select id="fDiv"></select></label>
    <label>Zone<select id="fZone"></select></label>
    <label>Loading month<select id="fMonth"></select></label>
    <button id="reload">Refresh data</button>
  </div>
</div>
<nav role="tablist"><button role="tab" data-v="ov" aria-selected="true">Overview</button><button role="tab" data-v="fd" aria-selected="false">Feeders</button><button role="tab" data-v="ls" aria-selected="false">Losses</button></nav>
<div id="msg">Reading the sheet tabs…</div>
<main id="app" hidden>
  <section id="ov"></section>
  <section id="fd" hidden><div class="split"><div><input type="search" id="q" placeholder="Search feeders" aria-label="Search feeders" style="width:100%;margin-bottom:6px"><div class="fl" id="fl"></div></div><div id="fdet"></div></div></section>
  <section id="ls" hidden></section>
</main>
<div id="foot"></div>
<script>
const SHEET_ID="1xnEkqyYsGhJLNZH0C2niWmZRqzfRdQUGpJH6Av5cHP8";
const TABS=["Consumer & Energy","HT Network","DT Loading","Feeder Code vs FL "];
const $=id=>document.getElementById(id);
const fmt=(v,d=0)=>isFinite(v)?new Intl.NumberFormat("en-IN",{maximumFractionDigits:d}).format(v):"–";
const num=v=>{const x=parseFloat(String(v??"").replace(/,/g,"").replace(/[^\d.\-eE]/g,""));return isFinite(x)?x:NaN};
const pctv=s=>{const n=num(s);return /%/.test(String(s))?n:(Math.abs(n)<=1.5?n*100:n)};
const key=c=>String(c||"").trim().toUpperCase().split("-").pop();
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uniq=a=>[...new Set(a.filter(Boolean))];
const tone=p=>p>100?"--hi":p>=80?"--mid":"--lo";
let D={},view="ov",sel=null;

function parseCSV(t){const rows=[];let r=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
  else if(c==='"')q=true;else if(c===","){r.push(f);f=""}
  else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;r.push(f);rows.push(r);r=[];f=""}else f+=c}
  if(f!==""||r.length){r.push(f);rows.push(r)}return rows}
async function tab(name){
  const base=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=`;
  let res=await fetch(base+encodeURIComponent(name));
  if(!res.ok&&name!==name.trim())res=await fetch(base+encodeURIComponent(name.trim()));
  if(!res.ok)throw new Error(`Could not read the “${name.trim()}” tab (HTTP ${res.status})`);
  return parseCSV(await res.text())}

async function load(){
  $("msg").hidden=false;$("msg").className="";$("msg").textContent="Reading the sheet tabs…";$("app").hidden=true;
  try{
    const [c,h,d,m]=await Promise.all(TABS.map(tab));
    D.cons=c.filter(r=>r[0]&&!/division/i.test(r[0])&&(isFinite(num(r[10]))||isFinite(num(r[15])))).map(r=>({
      zone:(r[14]||"").trim(),sc:(r[12]||"").trim(),key:key(r[2]),consumers:num(r[10])||0,
      inF:num(r[15])||0,inR:num(r[16])||0,bF:num(r[17])||0,bR:num(r[18])||0,lossF:pctv(r[21]),lossR:pctv(r[22])}));
    D.ht=h.filter(r=>r[2]&&!/EXTERNAL/i.test(r[2])).map(r=>({grid:(r[0]||"").trim(),feeder:(r[1]||"").trim(),scada:r[2].trim(),bKey:key(r[6]),len:num(r[8])||0}));
    D.dt=d.filter(r=>r[2]&&r[2]!=="DT_CODE").map(r=>({code:r[2],month:(r[1]||"").trim(),key:key(r[3]),kva:num(r[5]),peak:num(r[6]),
      hrs:r.slice(8,19).map(x=>num(x)||0),div:(r[19]||"").trim(),zone:(r[20]||"").trim(),name:(r[21]||"").trim()}));
    D.map=Object.fromEntries(m.filter(r=>r[0]&&!/EXTERNAL/i.test(r[0])).map(r=>[r[0].trim(),{div:(r[1]||"").trim()}]));
    D.dt.forEach(x=>x.pct=x.kva>0?x.peak/x.kva*100:NaN);
    D.fd={};D.ht.forEach(r=>{const f=D.fd[r.scada]??={scada:r.scada,name:r.feeder.replace(/^11kV FDR\s*/i,""),grid:r.grid,len:0,div:D.map[r.scada]?.div||""};f.len+=r.len});
    D.fBy={};D.ht.forEach(r=>{if(r.bKey)D.fBy[r.bKey]??=D.fd[r.scada]});
    D.cBy={};D.cons.forEach(x=>(D.cBy[x.key]??=x));
    D.dt.forEach(x=>{x.f=D.fBy[x.key];x.c=D.cBy[x.key]});
    setup();$("msg").hidden=true;$("app").hidden=false;render();
    $("sub").textContent=`Live from Master-Sheets, refreshed ${new Date().toLocaleTimeString("en-IN")}`;
  }catch(e){$("msg").className="err";$("msg").textContent=e.message+". Open this file in a browser outside the chat preview, make sure the sheet is shared as “Anyone with the link – Viewer”, then press Refresh data."}}

const MK=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const mkey=s=>{const[a,b]=s.split("-");return(+b||0)*12+MK.indexOf(a)};
function opts(el,vals,all){const cur=el.value;el.innerHTML=(all?`<option value="">${all}</option>`:"")+vals.map(v=>`<option>${esc(v)}</option>`).join("");if(vals.includes(cur))el.value=cur}
function setup(){const ms=uniq(D.dt.map(x=>x.month)).sort((a,b)=>mkey(b)-mkey(a));opts($("fMonth"),ms);if(!$("fMonth").value)$("fMonth").value=ms[0];
  opts($("fDiv"),uniq(D.dt.map(x=>x.div)).sort(),"All divisions");zones()}
function zones(){const dv=$("fDiv").value;opts($("fZone"),uniq(D.dt.filter(x=>!dv||x.div===dv).map(x=>x.zone)).sort(),"All zones")}
$("fDiv").onchange=()=>{zones();render()};$("fZone").onchange=render;$("fMonth").onchange=render;$("reload").onclick=load;$("q").oninput=render;
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});

const bar=(p,w=150)=>`<div class="trk"><i style="width:${Math.min(Math.max(p,0),w)/w*100}%;background:${css(tone(p))}"></i><u style="left:${80/w*100}%"></u><u style="left:${100/w*100}%"></u></div>`;
const loss=(i,b)=>i>0?(i-b)/i*100:NaN;

function render(){
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===view));
  ["ov","fd","ls"].forEach(v=>$(v).hidden=v!==view);
  const dv=$("fDiv").value,zn=$("fZone").value,mo=$("fMonth").value;
  const dts=D.dt.filter(x=>x.month===mo&&(!dv||x.div===dv)&&(!zn||x.zone===zn));
  const cons=D.cons.filter(x=>!zn||x.zone===zn);
  const ok=dts.filter(x=>isFinite(x.pct)),over=ok.filter(x=>x.pct>100),hi=ok.filter(x=>x.pct>=80);
  const fa=new Map();dts.forEach(x=>{if(!x.f)return;const o=fa.get(x.f)??{f:x.f,d:[],h:0,s:0,v:0};o.d.push(x);if(isFinite(x.pct)){o.s+=x.pct;o.v++;if(x.pct>=80)o.h++}fa.set(x.f,o)});
  const fl=[...fa.values()].sort((a,b)=>b.h-a.h||b.d.length-a.d.length);
  if(!sel||!fa.has(sel))sel=fl[0]?.f||null;
  if(view==="ov")overview(dts,ok,over,hi,fl,cons);
  if(view==="fd")feeders(fl);
  if(view==="ls")losses(cons);
  const mc=dts.length?dts.filter(x=>x.c).length/dts.length*100:0,mf=dts.length?dts.filter(x=>x.f).length/dts.length*100:0;
  $("foot").textContent=`Join check: ${fmt(mc)}% of the DTs shown matched the Consumer & Energy tab and ${fmt(mf)}% matched an HT feeder, using the code after the last “-”. The zone filter also narrows the loss figures; division applies to DT data only. Feeder Loading is not included yet.`;
}

function overview(dts,ok,over,hi,fl,cons){
  const B=[["Under 40%",0,40,"--lo"],["40–60%",40,60,"--lo"],["60–80%",60,80,"--lo"],["80–100%",80,100,"--mid"],["Over 100%",100,1e9,"--hi"]];
  const cnt=B.map(b=>ok.filter(x=>x.pct>=b[1]&&x.pct<b[2]).length);
  const sh=[.45,.7,.9,1,1];
  const iR=cons.reduce((s,x)=>s+x.inR,0),bR=cons.reduce((s,x)=>s+x.bR,0),iF=cons.reduce((s,x)=>s+x.inF,0),bF=cons.reduce((s,x)=>s+x.bF,0);
  const H=Array(11).fill(0);dts.forEach(x=>x.hrs.forEach((v,i)=>H[i]+=v));const mx=Math.max(...H,1);
  const worst=[...ok].sort((a,b)=>b.pct-a.pct).slice(0,8);
  $("ov").innerHTML=`
  <p class="lead">${fmt(dts.length)} transformers on ${fmt(fl.length)} feeders. <em>${fmt(over.length)} peaked above their rating</em> and ${fmt(hi.length-over.length)} more reached 80% or more.</p>
  <div class="spec" role="img" aria-label="Distribution of DTs by peak load">${B.map((b,i)=>`<i style="flex:${Math.max(cnt[i],.4)};background:${css(b[3])};opacity:${sh[i]}"></i>`).join("")}</div>
  <div class="speclab">${B.map((b,i)=>`<span style="flex:${Math.max(cnt[i],.4)}">${cnt[i]?`${fmt(cnt[i])} · ${b[0]}`:""}</span>`).join("")}</div>
  <div class="facts">
    <div><b>${fmt(dts.reduce((s,x)=>s+(x.kva||0),0)/1000,1)}</b><span>MVA installed</span></div>
    <div><b>${fmt(cons.reduce((s,x)=>s+x.consumers,0))}</b><span>consumers</span></div>
    <div><b>${fmt(loss(iF,bF),1)}%</b><span>energy loss, FY-26</span></div>
    <div><b>${fmt(loss(iR,bR),1)}%</b><span>energy loss, rolling Aug-26</span></div>
    <div><b>${fmt(Object.keys(D.fd).length)}</b><span>HT feeders in network</span></div>
  </div>
  <div class="cols">
    <div><h2>Hours spent at each load level</h2><p class="sub">All filtered DTs, selected month. Right-hand bars are the hours near or over capacity.</p>
      <div class="hrs">${H.map((v,i)=>`<div title="${fmt(v)} hours"><i style="height:${v/mx*88}%;background:${css(i>=10?"--hi":i>=8?"--mid":"--lo")}"></i>${i*10}</div>`).join("")}</div>
      <p class="sub">Load band start, % of rating (last bar is above 100%)</p></div>
    <div><h2>Transformers to look at first</h2><p class="sub">Highest peak load against rating. Marks show 80% and 100%.</p>
      <ul class="rows">${worst.map(x=>`<li class="dtrow"><div>${esc(x.name||x.code)}<small>${esc(x.f?x.f.name:x.code)}</small></div><div class="n">${fmt(x.pct)}%</div>${bar(x.pct)}</li>`).join("")}</ul></div>
  </div>`}

function feeders(fl){
  const q=$("q").value.trim().toLowerCase();
  const list=fl.filter(o=>!q||(o.f.name+o.f.scada+o.f.grid).toLowerCase().includes(q));
  const g={};list.forEach(o=>(g[o.f.grid||"Other"]??=[]).push(o));
  $("fl").innerHTML=Object.keys(g).sort().map(k=>`<h3>${esc(k)}</h3>`+g[k].map(o=>`<button aria-pressed="${o.f===sel}" data-s="${esc(o.f.scada)}">${esc(o.f.name)}<span>${o.d.length} DTs · ${o.h} at 80%+</span>${bar(o.v?o.s/o.v:0)}</button>`).join("")).join("")||`<p class="sub">No feeders match.</p>`;
  $("fl").querySelectorAll("button").forEach(b=>b.onclick=()=>{sel=D.fd[b.dataset.s];render()});
  const o=fl.find(x=>x.f===sel);
  $("fdet").innerHTML=!o?`<p class="sub">No filtered DTs are tagged to a feeder.</p>`:`
    <h2>${esc(o.f.name)}</h2><p class="sub">${esc(o.f.grid)} · SCADA ${esc(o.f.scada)}${o.f.div?" · "+esc(o.f.div):""} · ${fmt(o.f.len)} m of HT cable</p>
    <div class="facts" style="margin-bottom:12px"><div><b>${o.d.length}</b><span>DTs on this feeder</span></div><div><b>${fmt(o.d.reduce((s,x)=>s+(x.kva||0),0))}</b><span>kVA connected</span></div><div><b>${o.v?fmt(o.s/o.v):"–"}%</b><span>average peak load</span></div><div><b>${fmt(o.d.reduce((s,x)=>s+(x.c?.consumers||0),0))}</b><span>consumers</span></div></div>
    <ul class="rows">${[...o.d].sort((a,b)=>(b.pct||0)-(a.pct||0)).map(x=>`<li class="dtrow"><div>${esc(x.name||x.code)}<small>${esc(x.code)} · ${fmt(x.kva)} kVA${x.c?` · loss ${fmt(x.c.lossR,1)}%`:""}</small></div><div class="n">${fmt(x.pct)}%</div>${bar(x.pct)}</li>`).join("")}</ul>`}

function losses(cons){
  const z={};cons.forEach(x=>{const o=z[x.zone]??={iF:0,bF:0,iR:0,bR:0,c:0};o.iF+=x.inF;o.bF+=x.bF;o.iR+=x.inR;o.bR+=x.bR;o.c+=x.consumers});
  const zs=Object.entries(z).filter(([k])=>k).map(([k,o])=>({k,o,F:loss(o.iF,o.bF),R:loss(o.iR,o.bR)})).sort((a,b)=>(b.R||0)-(a.R||0));
  const s={};cons.forEach(x=>{if(!x.sc)return;const o=s[x.sc]??={sc:x.sc,zone:x.zone,c:0,R:x.lossR,F:x.lossF};o.c+=x.consumers});
  const ss=Object.values(s).filter(o=>isFinite(o.R)).sort((a,b)=>b.R-a.R).slice(0,15);
  $("ls").innerHTML=`<div class="cols">
    <div><h2>Loss by zone</h2><p class="sub">Rolling Aug-26 first, FY-26 beside it. Bar shows rolling loss on a 0 to 40% scale.</p>
      ${zs.map(r=>`<div class="lossrow"><div>${esc(r.k)}<small style="display:block;color:var(--mute);font-size:12px">${fmt(r.o.c)} consumers</small></div><div class="n">${fmt(r.R,1)}%</div><div class="n" style="color:var(--mute)">${fmt(r.F,1)}%</div>${bar(r.R,40).replace(/<u[^>]*><\/u>/g,"")}</div>`).join("")}</div>
    <div><h2>Service centres with the highest loss</h2><p class="sub">Rolling Aug-26 loss, as recorded in the sheet.</p>
      <ul class="rows">${ss.map(o=>`<li><div>${esc(o.sc)}<small>${esc(o.zone)} · ${fmt(o.c)} consumers</small></div><div class="n">${fmt(o.R,1)}%</div>${bar(o.R,40).replace(/<u[^>]*><\/u>/g,"")}</li>`).join("")}</ul></div></div>`}
load();
</script>
</body>
</html>
