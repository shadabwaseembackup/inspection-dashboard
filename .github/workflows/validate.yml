name: Validate dashboard
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", html, re.I)
          if not scripts:
              raise SystemExit("No inline JavaScript found")
          Path("/tmp/dashboard-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/dashboard-inline.js
      - name: Verify core dashboard and intelligence features
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path("index.html").read_text(encoding="utf-8")
          required = [
              'data-sub="intelligence"',
              "function viewIntelligence(D)",
              "function viewAnalytics(D)",
              "function buildFP(rows)",
              "function buildDT(rows)",
              "function filterDefRows(rows)",
              'id="intelForm"',
              'id="fcat"',
              "substation-heading",
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit("Missing required features: " + ", ".join(missing))
          print("Core dashboard and intelligence features verified.")
          PY
      - name: Check optional AI Worker syntax and free-tier safeguards
        run: |
          if [ -f ai-worker/worker.js ]; then
            node --check ai-worker/worker.js
            test -f ai-worker/wrangler.toml
            grep -q 'TURNSTILE_SECRET' ai-worker/worker.js
            grep -q 'aggregateOnly' ai-worker/worker.js
            grep -q '@cf/zai-org/glm-4.7-flash' ai-worker/worker.js
            ! grep -Eq '@cf/meta/llama-3.2-3b-instruct|@cf/meta/llama-3-8b-instruct|@cf/google/gemma-4-26b-a4b-it' ai-worker/worker.js
            grep -q 'No paid fallback was attempted' ai-worker/worker.js
            echo "AI Worker syntax, model selection, and privacy/cost guard checks passed."
          fi
