<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Secure Login · Alaknanda Division</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#0b1424;color:#e8eefb}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
.panel{width:min(100%,420px);padding:30px;border:1px solid #2a3b55;border-radius:24px;background:#121f32;box-shadow:0 20px 60px #0005}
.mark{width:44px;height:5px;border-radius:9px;background:#83a9ff;margin-bottom:22px}
h1{font-size:25px;margin:0 0 8px}p{color:#9eacc2;line-height:1.5;margin:0 0 24px}
label{display:block;font-size:14px;color:#c6d2e5;margin-bottom:8px}
input{width:100%;padding:15px;border:1px solid #344862;border-radius:12px;background:#0b1424;color:#fff;font-size:16px;outline:none}
input:focus{border-color:#83a9ff;box-shadow:0 0 0 3px #83a9ff22}
button{width:100%;margin-top:16px;padding:15px;border:0;border-radius:12px;background:#83a9ff;color:#071225;font-weight:700;font-size:16px;cursor:pointer}
.error{display:none;color:#ff9e9e;font-size:14px;margin:0 0 16px}.error.show{display:block}
small{display:block;color:#8292aa;text-align:center;margin-top:20px}
</style>
</head>
<body>
<main class="panel">
<div class="mark"></div>
<h1>Alaknanda Division</h1>
<p>GK-2 · Inspection Dashboard<br>Enter the access password to continue.</p>
<p class="error" id="error" role="alert">Incorrect password. Please try again.</p>
<form method="post" action="/api/login">
<label for="password">Dashboard password</label>
<input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
<button type="submit">Unlock dashboard</button>
</form>
<small>Authorized access only · Session expires after 12 hours</small>
</main>
<script>if(new URLSearchParams(location.search).has("error"))document.getElementById("error").classList.add("show");</script>
</body>
</html>
